name: Go GraphQL CI

on :
  push:
    branches:
      - main
      - master

    pull_request:
      branches:
       - main
       - master

jobs:

  test:
      runs-on: ubuntu-latest
      
      services:
       postgres:
          image:postgres:16
          env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: graphql
        ports:
         - 5432:5432

           options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: graphql
      DB_PORT: 5432
      JWT_SECRET: supersecret

  steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Build app
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Verify Docker build
        run: docker build -t todo-app .
